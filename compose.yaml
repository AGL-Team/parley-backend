name: parley

x-authentik-build: &authentik-build
  context: .
  dockerfile: docker/authentik/Dockerfile
  args:
    AUTHENTIK_VERSION: ${AUTHENTIK_VERSION:-2026.8.3}

x-authentik-environment: &authentik-environment
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__PORT: 5432
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
  AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING_ENABLED:-false}

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13-slim}
    restart: unless-stopped
    environment:
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-http://localhost:9000/application/o/parley/}
      AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL:-http://authentik-server:9000/application/o/parley/jwks/}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?Set AUTHENTIK_CLIENT_ID in .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - parley_internal

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      PARLEY_DB_NAME: ${PARLEY_DB_NAME:-parley}
      PARLEY_DB_USER: ${PARLEY_DB_USER:-parley}
      PARLEY_DB_PASSWORD: ${PARLEY_DB_PASSWORD:?Set PARLEY_DB_PASSWORD in .env}
      AUTHENTIK_DB_NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - parley_internal

  postgres-migrations:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_ADMIN_DB: ${POSTGRES_ADMIN_DB:-postgres}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      AUTHENTIK_DB_NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
    command: ["/bin/sh", "/migrations/ensure-authentik-database.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    networks:
      - parley_internal

  authentik-server:
    build: *authentik-build
    restart: unless-stopped
    command: server
    environment: *authentik-environment
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    ports:
      - "${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    volumes:
      - authentik_media:/media
      - ./infra/authentik/templates:/templates:ro
    networks:
      - parley_internal

  authentik-worker:
    build: *authentik-build
    restart: unless-stopped
    command: worker
    environment: *authentik-environment
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - ./infra/authentik/templates:/templates:ro
      - ./infra/authentik/blueprints:/blueprints/custom:ro
    networks:
      - parley_internal

volumes:
  postgres_data:
  authentik_media:
  authentik_certs:

networks:
  parley_internal:
    driver: bridge
