# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Parley
  labels:
    blueprints.goauthentik.io/description: Parley groups, enrollment flow, and OIDC application
entries:
  - model: authentik_core.group
    id: parley-users
    identifiers:
      name: parley-users
    attrs:
      is_superuser: false

  - model: authentik_core.group
    id: parley-admins
    identifiers:
      name: parley-admins
    attrs:
      is_superuser: false

  - model: authentik_flows.flow
    id: parley-enrollment-flow
    identifiers:
      slug: default-enrollment-flow
    attrs:
      name: Default enrollment Flow
      title: Welcome to Parley!
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-username
    identifiers:
      name: default-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password
    identifiers:
      name: default-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password-repeat
    identifiers:
      name: default-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-email
    identifiers:
      name: default-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt-credentials
    identifiers:
      name: default-enrollment-prompt-first
    attrs:
      fields:
        - !KeyOf enrollment-field-username
        - !KeyOf enrollment-field-password
        - !KeyOf enrollment-field-password-repeat

  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt-profile
    identifiers:
      name: default-enrollment-prompt-second
    attrs:
      fields:
        - !KeyOf enrollment-field-email

  - model: authentik_stages_user_write.userwritestage
    id: enrollment-user-write
    identifiers:
      name: default-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      create_users_group: !KeyOf parley-users
      user_type: external

  - model: authentik_stages_user_login.userloginstage
    id: enrollment-user-login
    identifiers:
      name: default-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-prompt-credentials
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-prompt-profile
      order: 11

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-user-write
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-user-login
      order: 100

  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - username
        - email
      enrollment_flow: !Find
        - authentik_flows.flow
        - [slug, default-enrollment-flow]

  - model: authentik_flows.flow
    id: registration-rollback-flow
    identifiers:
      slug: parley-registration-rollback-flow
    attrs:
      name: Parley registration rollback
      title: Registration rollback
      designation: unenrollment
      authentication: require_authenticated

  - model: authentik_stages_user_delete.userdeletestage
    id: registration-rollback-delete-user
    identifiers:
      name: parley-registration-rollback-delete-user

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf registration-rollback-flow
      stage: !KeyOf registration-rollback-delete-user
      order: 10

  # OIDC/JWT is intentionally disabled for the session-based MVP.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: parley

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: Provider for Parley
