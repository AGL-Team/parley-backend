# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Parley
  labels:
    blueprints.goauthentik.io/description: Parley groups, enrollment flow, and OIDC application
entries:
  - model: authentik_core.group
    id: parley-users
    identifiers:
      name: parley-users
    attrs:
      is_superuser: false

  - model: authentik_core.group
    id: parley-admins
    identifiers:
      name: parley-admins
    attrs:
      is_superuser: false

  - model: authentik_flows.flow
    id: parley-enrollment-flow
    identifiers:
      slug: default-enrollment-flow
    attrs:
      name: Default enrollment Flow
      title: Welcome to Parley!
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-username
    identifiers:
      name: default-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password
    identifiers:
      name: default-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password-repeat
    identifiers:
      name: default-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-name
    identifiers:
      name: default-enrollment-field-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: Name
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-email
    identifiers:
      name: default-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt-credentials
    identifiers:
      name: default-enrollment-prompt-first
    attrs:
      fields:
        - !KeyOf enrollment-field-username
        - !KeyOf enrollment-field-password
        - !KeyOf enrollment-field-password-repeat

  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt-profile
    identifiers:
      name: default-enrollment-prompt-second
    attrs:
      fields:
        - !KeyOf enrollment-field-name
        - !KeyOf enrollment-field-email

  - model: authentik_stages_user_write.userwritestage
    id: enrollment-user-write
    identifiers:
      name: default-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      create_users_group: !KeyOf parley-users
      user_type: external

  - model: authentik_stages_user_login.userloginstage
    id: enrollment-user-login
    identifiers:
      name: default-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-prompt-credentials
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-prompt-profile
      order: 11

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-user-write
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf parley-enrollment-flow
      stage: !KeyOf enrollment-user-login
      order: 100

  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - username
        - email
      enrollment_flow: !Find
        - authentik_flows.flow
        - [slug, default-enrollment-flow]

  - model: authentik_providers_oauth2.oauth2provider
    id: parley-provider
    identifiers:
      name: Provider for Parley
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      client_id: 1D6TiChVCmwjSyd5f4HmWVZyJ57sKhs6tZXP1DYi
      client_type: public
      grant_types:
        - authorization_code
        - refresh_token
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: http://localhost:8000/docs/oauth2-redirect
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]

  - model: authentik_core.application
    identifiers:
      slug: parley
    attrs:
      name: Parley
      provider: !KeyOf parley-provider
      policy_engine_mode: any
